[workspace]
channels = ["conda-forge"]
name = "rag3"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[activation.env]
PYTHONPATH = "src"

[tasks]
test = "pytest"

[dependencies]
python = "3.11.*"
rich = ">=15.0.0,<16"
pre-commit = ">=4.7.0,<5"
ruff = ">=0.17.2,<0.18"

[pypi-dependencies]
marker-pdf = "==1.10.2"
pymupdf4llm = ">=1.28.2, <2"
langchain-text-splitters = ">=1.1.3, <2"
langchain-google-genai = ">=4.3.7, <5"
langchain-chroma = ">=1.1.0, <2"
python-dotenv = ">=1.2.4, <2"
pytest = ">=9.1.1, <10"
rank-bm25 = ">=0.2.2, <0.3"

[tool.ruff] 
line-length = 120

[feature.eval.pypi-dependencies]
ragas = "==0.4.3"
langchain-community = "==0.3.31"

[environments]
eval = ["eval"]
